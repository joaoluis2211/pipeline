name: Pipeline Calculadora

on:
  push:
    branches:
      - main

jobs:

  qualidade-e-seguranca:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Análise de Segurança (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build:
    runs-on: ubuntu-latest
    needs: [qualidade-e-seguranca]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      - name: Simular Build do Projeto
        run: echo "Nenhum script de build necessário para JS puro. Build concluído."


  testes-matriz:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        # Testa toda a sua suíte de testes nas 3 versões do Node.js em paralelo
        node-version: ['20', '21', '22']

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Instala o Jest listado no package.json localmente na máquina virtual
      - name: Instalar Dependências do Projeto
        run: npm install

      # Executa o comando "jest" mapeado em "npm run teste"
      - name: Executar Testes com Jest
        run: npm run teste


  deploy:
    runs-on: ubuntu-latest
    needs: [testes-matriz]
    steps:
      - name: Deploy
        run: echo "Todos os testes passaram no Jest. Fazendo deploy..."
