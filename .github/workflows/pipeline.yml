name: Pipeline Calculadora

on:
  push:
    branches:
      - main

jobs:

  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Codigo do Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias
        run: npm install

      - name: Analise Estatica (Linter)
        run: npm run lint

      - name: Testes Unitarios e Cobertura Minima
        run: npm test

      - name: Analise de Seguranca (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


  teste-soma:
    strategy:
      matrix:
        node-version: ['20', '21', '22']

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar Jest
        run: npm install -g jest

      - name: Testar soma
        run: jest calculadora.test.js -t "soma" --config='{}'


  teste-subtracao:
    strategy:
      matrix:
        node-version: ['20', '21', '22']
        
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar Jest
        run: npm install -g jest

      - name: Testar subtração
        run: jest calculadora.test.js -t "subtracao" --config='{}'


  teste-multiplicacao:
    strategy:
      matrix:
        node-version: ['20', '21', '22']
        
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar Jest
        run: npm install -g jest

      - name: Testar multiplicação
        run: jest calculadora.test.js -t "multiplicacao" --config='{}'


  teste-divisao:
    strategy:
      matrix:
        node-version: ['20', '21', '22']
        
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar Jest
        run: npm install -g jest

      - name: Testar divisão
        run: jest calculadora.test.js -t "divisao" --config='{}'


  deploy:
    runs-on: ubuntu-latest

    needs:
      - teste-soma
      - teste-subtracao
      - teste-multiplicacao
      - teste-divisao

    steps:
      - name: Deploy
        run: echo "Todos os testes passaram. Fazendo deploy..."