name: Pipeline Calculadora

on:
  push:
    branches:
      - main

jobs:

  qualidade-e-seguranca:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Análise de Segurança (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build:
    runs-on: ubuntu-latest
    needs: [qualidade-e-seguranca]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      # Compacta o código do projeto e a pasta node_modules num arquivo chamado projeto.zip
      - name: Gerar Arquivo ZIP do Projeto
        run: zip -r projeto.zip . -x ".git/*" ".github/*"

      # Guarda o arquivo ZIP nos servidores do GitHub para os próximos jobs usarem
      - name: Guardar Artefato ZIP
        uses: actions/upload-artifact@v4
        with:
          name: codigo-compactado
          path: projeto.zip
          retention-days: 1 # Opcional: apaga o arquivo após 1 dia para poupar espaço


  testes-matriz:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        node-version: ['22', '23', '24']

    steps:
      # Descarrega o arquivo ZIP que foi gerado no job de build
      - name: Baixar Artefato ZIP do Build
        uses: actions/download-artifact@v4
        with:
          name: codigo-compactado

      # Descompacta o arquivo ZIP na raiz da nova máquina virtual antes de testar
      - name: Descompactar Arquivo do Projeto
        run: |
          unzip projeto.zip
          rm projeto.zip

      - name: Configurar Node.js da Matriz
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Como o node_modules veio dentro do ZIP, executamos diretamente o Jest
      - name: Executar Testes com Jest
        run: npm run teste


  deploy:
    runs-on: ubuntu-latest
    needs: [testes-matriz]
    steps:
      - name: Deploy
        run: echo "Todos os testes passaram no arquivo descompactado. Fazendo deploy..."
