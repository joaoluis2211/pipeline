name: Pipeline Calculadora

on:
  push:
    branches:
      - main

jobs:

  qualidade-e-seguranca:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Dependencias
        run: npm install

      - name: Analise Estatica (Linter)
        run: npm run lint

      - name: Testes Unitarios e Cobertura Minima
        run: npm test

      - name: Análise de Segurança (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build:
    runs-on: ubuntu-latest
    needs: [qualidade-e-seguranca]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      
      - name: Gerar Arquivo ZIP do Projeto
        run: zip -r projeto.zip . -x ".git/*" ".github/*"

      
      - name: Guardar Artefato ZIP
        uses: actions/upload-artifact@v4
        with:
          name: codigo-compactado
          path: projeto.zip
          retention-days: 1 


  testes-matriz:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        node-version: ['22', '23', '24']

    steps:
      
      - name: Baixar Artefato ZIP do Build
        uses: actions/download-artifact@v4
        with:
          name: codigo-compactado

      
      - name: Descompactar Arquivo do Projeto
        run: |
          unzip projeto.zip
          rm projeto.zip

      - name: Configurar Node.js da Matriz
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      
      - name: Executar Testes com Jest
        run: npm run teste


  deploy:
    runs-on: ubuntu-latest
    needs: [testes-matriz]
    environment:
      name: productions
    steps:
      - name: Deploy
        run: echo "Todos os testes passaram no arquivo descompactado. Fazendo deploy..."
